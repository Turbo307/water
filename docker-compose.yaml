version: '3.8'

services:
  web:
    build: .
    container_name: Water_Report_API
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
    # Si en el futuro necesitamos una base de datos externa, se vincula aqui abajo:
    # depends_on:
    #   - db