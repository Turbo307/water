{% load static %}

<!DOCTYPE html>

<html lang="es">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="description"
    content="Sistema de reportes de fugas de agua"
>

<title>

    {% block title %}

        Water

    {% endblock %}

</title>


<!-- CSS GLOBAL USERS -->

<link
    rel="stylesheet"
    href="{% static 'css/users/base.css' %}"
>


<!-- CSS ESPECÍFICO DE LA PÁGINA -->

{% block extra_css %}
{% endblock %}


</head>

<body>


<!-- HEADER / NAVBAR -->

<header class="user-header">

    <div class="user-header__container">


        <!-- LOGO -->

        <a
            href="{% url 'home' %}"
            class="user-logo"
        >

            <span class="user-logo__icon">

                W

            </span>


            <span class="user-logo__text">

                Waterss

            </span>

        </a>


        <!-- NAVEGACIÓN -->

        <nav class="user-nav">


            <!-- INICIO -->

            <a
                href="{% url 'home' %}"
                class="user-nav__link"
            >

                Inicio

            </a>


            <!-- USUARIO AUTENTICADO -->

            <div
                id="navbar-authenticated"
                hidden
            >


                <a
                    href="{% url 'reportes_usuario' %}"
                    class="user-nav__link"
                >

                    Mis reportes

                </a>


                <span
                    class="user-nav__user"
                    id="navbar-username"
                >

                </span>


                <button
                    type="button"
                    class="user-nav__logout"
                    id="navbar-logout"
                >

                    Cerrar sesión

                </button>


            </div>


            <!-- USUARIO NO AUTENTICADO -->

            <div
                id="navbar-guest"
            >


                <a
                    href="{% url 'login' %}"
                    class="user-nav__link"
                >

                    Iniciar sesión

                </a>


                <a
                    href="{% url 'registro' %}"
                    class="user-nav__button"
                >

                    Crear cuenta

                </a>


            </div>


        </nav>


    </div>

</header>


<!-- CONTENIDO PRINCIPAL -->

<main class="user-main">

    {% block content %}
    {% endblock %}

</main>


<!-- FOOTER -->

<footer class="user-footer">

    <div class="user-footer__container">


        <p>

            Water Report

        </p>


        <p>

            Sistema de reportes de fugas de agua

        </p>


    </div>

</footer>


<!-- JAVASCRIPT GLOBAL -->

<script
    src="{% static 'js/users/navbar.js' %}"
></script>


<!-- JAVASCRIPT ESPECÍFICO DE LA PÁGINA -->

{% block extra_js %}
{% endblock %}


</body>

</html>
