<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema de Reportes de Fugas</title>
    <link rel="stylesheet" href="/static/css/users/registro.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1> Crear Cuenta</h1>
            <p>Únete al Sistema de Reportes de Fugas</p>
        </div>
        
        <div class="form-container">
            {% if errors %}
            <div class="errors">
                <ul>
                    {% for error in errors %}
                    <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
            {% endif %}
            
            <form method="POST" action="{% url 'registro' %}" novalidate>
                {% csrf_token %}
                
                <div class="form-group">
                    <label for="username">
                        Nombre de Usuario <span class="required">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Ej: juan_perez"
                        value="{{ username }}"
                        required
                        minlength="3"
                        maxlength="150"
                    >
                </div>
                
                <div class="form-group">
                    <label for="email">
                        Correo Electrónico <span class="required">*</span>
                    </label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Ej: juan@example.com"
                        value="{{ email }}"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="first_name">
                        Nombre Completo
                    </label>
                    <input 
                        type="text" 
                        id="first_name" 
                        name="first_name" 
                        placeholder="Ej: Juan Pérez"
                        value="{{ first_name }}"
                        maxlength="150"
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">
                        Contraseña <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Mínimo 6 caracteres"
                        required
                        minlength="6"
                    >
                    <div class="password-requirements">
                        <ul>
                            <li>Mínimo 6 caracteres</li>
                            <li>Puede incluir letras, números y símbolos</li>
                        </ul>
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password_confirm">
                        Confirmar Contraseña <span class="required">*</span>
                    </label>
                    <input 
                        type="password" 
                        id="password_confirm" 
                        name="password_confirm" 
                        placeholder="Repite tu contraseña"
                        required
                        minlength="6"
                    >
                </div>
                
                <button type="submit" class="btn-register">
                    Crear Cuenta
                </button>
            </form>
        </div>
        
        <div class="footer">
            <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión aquí</a></p>
        </div>
    </div>
</body>
</html>
