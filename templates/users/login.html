<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Reportes de Fugas</title>
    <link rel="stylesheet" href="/static/css/users/login.css">
</head>
<body>
    <div class="login-page">
        <div class="login-card">
            <div class="login-header">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa tus datos para acceder al panel de reportes.</p>
            </div>

            {% if error %}
            <div class="login-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="{% url 'login' %}" novalidate>
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input type="text" id="username" name="username" value="{{ username }}" placeholder="Usuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required>
                </div>

                <button type="submit" class="btn-login">Acceder</button>
            </form>

            <div class="login-footer">
                <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Crear una cuenta</a></p>
                <p><a href="{% url 'home' %}">Volver a inicio</a></p>
            </div>
        </div>
    </div>
</body>
</html>
