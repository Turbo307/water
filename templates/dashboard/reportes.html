{% extends 'dashboard/base.html' %}

{% block title %}Reportes{% endblock %}

{% block content %}

<h1>Reportes de Fugas</h1>

<p>
    Aquí se muestran todos los reportes registrados por los usuarios.
</p>

<table class="tabla-reportes">

    <thead>
        <tr>
            <th>Tipo</th>
            <th>Usuario</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Fecha</th>
            <th>Acciones</th>
        </tr>
    </thead>

    <tbody id="tabla-reportes-body">

        <tr>
            <td colspan="6" style="text-align:center;">
                Cargando reportes...
            </td>
        </tr>

    </tbody>

</table>

<script>

    const token = localStorage.getItem("access_token");

    fetch("/api/reportes-fuga/", {
    method: "GET",
    headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json"
    }
 })
        .then(response => {

            if (!response.ok) {
                throw new Error("Error al obtener los reportes");
            }

            return response.json();
        })

        .then(reportes => {

            const tbody = document.getElementById("tabla-reportes-body");

            tbody.innerHTML = "";

            if (reportes.length === 0) {

                tbody.innerHTML = `
                    <tr>
                        <td colspan="6" style="text-align:center;">
                            No existen reportes registrados.
                        </td>
                    </tr>
                `;

                return;
            }

            reportes.forEach(reporte => {

                const fila = document.createElement("tr");

                fila.innerHTML = `
                    <td>${reporte.tipo_incidente || "Sin tipo"}</td>

                    <td>${reporte.owner_username || "Sin usuario"}</td>

                    <td>${reporte.direccion_manual || "Sin dirección"}</td>

                    <td>${reporte.estatus || "Sin estado"}</td>

                    <td>
                        ${reporte.fecha_creacion
                            ? new Date(reporte.fecha_creacion).toLocaleString("es-MX")
                            : "Sin fecha"}
                    </td>

                    <td>
                        <a href="/reportes/${reporte.id}/">
                            Ver detalle
                        </a>
                    </td>
                `;

                tbody.appendChild(fila);

            });

        })

        .catch(error => {

            console.error("Error:", error);

            const tbody = document.getElementById("tabla-reportes-body");

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" style="text-align:center;">
                        Error al cargar los reportes.
                    </td>
                </tr>
            `;

        });
