<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Water Admin{% endblock %}</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
</head>

<body>

    <header class="topbar">
        <div class="logo">
            <h2>Water Admin</h2>
        </div>

        <div class="user-info">
            <span>Administrador</span>
        </div>
    </header>

    <div class="container">

        <aside class="sidebar">

            <h3>Menú</h3>

            <nav>
                <ul>

                    <li>
                        <a href="{% url 'dashboard' %}">
                            Dashboard
                        </a>
                    </li>

                    <li>
                        <a href="{% url 'reportes' %}">
                            Reportes
                        </a>
                    </li>

                </ul>
            </nav>

        </aside>

        <main class="content">

            {% block content %}

            {% endblock %}

        </main>

    </div>

    <footer>
        <p>Water API - Panel Administrativo</p>
    </footer>

    <script src="{% static 'js/dashboard.js' %}"></script>

</body>
</html>
